[package]
name = "app-ui"
description = "OpenBilling user interface shared by the desktop and mobile apps"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Native file dialogs, "open with" and OS folders (Windows, macOS, Linux).
desktop = ["dep:rfd", "dep:open", "dep:directories"]

[dependencies]
app-core = { path = "../core" }
slint = "1.18.1"
chrono = "0.4.45"
rfd = { version = "0.18.0", optional = true }
open = { version = "5.4.5", optional = true }
directories = { version = "6.0.0", optional = true }

[build-dependencies]
slint-build = "1.18.1"
